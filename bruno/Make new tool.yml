info:
  name: Make new tool
  type: http
  seq: 6

http:
  method: POST
  url: http://localhost:4000/api/tools
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Hammer",
        "category": "hand",
        "condition": "new",
        "available": true,
        "maxLoanDays": 7
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
